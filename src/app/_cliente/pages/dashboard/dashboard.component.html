
 <!-- Main Content -->
<main class="main-content">
  <div class="content-container">
    <!-- Search Bar -->
    <div class="search-bar">
      <div class="menu-container">
        <button class="menu-button" (click)="toggleMenu()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="menu-items" *ngIf="menuOpen">
          <button (click)="selectProduct('pelicula')" class="menu-item">Película</button>
          <button (click)="selectProduct('libro')" class="menu-item">Libro</button>
        </div>
      </div>   
      <div class="search-input-container">
        <input type="text" placeholder="Buscador" class="search-input">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
    </div>
  </div>
</main>
