
<!-- Main Content -->
<main class="main-content">
  <div class="content-container">
    <!-- Search Bar -->
    <div class="search-bar">
      <div class="menu-container">
        <button class="menu-button" (click)="toggleMenu()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="menu-items" *ngIf="menuOpen">
          <button (click)="selectProduct('pelicula')" class="menu-item">Película</button>
          <button (click)="selectProduct('libro')" class="menu-item">Libro</button>
          <button (click)="selectProduct('todos')" class="menu-item">Todos</button>
        </div>
      </div>   
      <div class="search-input-container">
        <input type="text" placeholder="Buscador" class="search-input" (input)="onSearch($event)">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <!-- Botón en el lado derecho de la barra de búsqueda -->
      <div class="relative right-menu">
        <button type="button" (click)="toggleRightMenu()" class="menu-button text-white flex items-center">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 10a2 2 0 110-4 2 2 0 010 4zm4 0a2 2 0 110-4 2 2 0 010 4zm4 0a2 2 0 110-4 2 2 0 010 4z" fill="black"></path>
          </svg>
        </button>
        <div (click)="closeRightMenu()" class="fixed inset-0 z-10" *ngIf="rightMenuOpen"></div>
        <ul *ngIf="rightMenuOpen" class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg z-20">
          <li>
            <button (click)="goToPasswordChange()" class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100">Cambiar Contraseña</button>
            <button (click)="goToLogin()" class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100">Cerrar Sesión</button>
          </li>
        </ul>
        <div class="cart-container" *ngIf="cart.length > 0">
          <button class="cart-button" (click)="toggleCart()">Carrito ({{ cart.length }})</button>
          <div class="cart-items" *ngIf="cartOpen">
            <div *ngFor="let item of cart" class="cart-item">
              {{ item.title }} - ${{ item.rental_price }}
              <button class="rent-button" (click)="removeFromCart(item)">Eliminar</button>
            </div>
            <div class="rental-days">
              <label for="rentalDays">Días de arriendo:</label>
              <input type="number" id="rentalDays" (input)="updateRentalDays($event)" min="1" class="rental-days-input">
            </div>
            <button class="rent-button" (click)="calculateFinalPrice()">Arrendar</button>
          </div>
        </div>
      </div>
    </div>
    <div class="product-list" *ngFor="let product of filteredProducts">
      <div class="product-item bg-white border dark:bg-gray-800 dark:border-gray-700 p-4 m-2 rounded-lg flex items-center">
        <img *ngIf="product.imageUrl" [src]="product.imageUrl" alt="{{ product.title }}" class="product-image">
        <div>
          <div class="product-title text-xl font-bold mb-2">Título: {{ product.title }}</div>
          <div class="product-rental-price text-lg mb-2">Precio de Renta (CLP): ${{ product.rental_price }}</div>
          <div class="product-type text-md">Tipo: {{ product.type }}</div>
        </div>
          <button class="rent-button" (click)="addToCart(product)">Rentar</button>
      </div>
    </div>
    <div class="pagination-controls">
      <button (click)="previousPage()" [disabled]="currentPage === 1">Anterior</button>
      <span>Página {{ currentPage }} de {{ totalPages }}</span>
      <button (click)="nextPage()" [disabled]="currentPage === totalPages">Siguiente</button>
    </div>
    <div *ngIf="showFinalPrice" class="final-price-modal">
      <div class="final-price-content">
        <p>El precio final del arriendo es: ${{ finalPrice }}</p>
        <button class="confirm-button" (click)="confirmFinalRental()">Confirmar</button>
        <button class="cancel-button" (click)="cancelFinalRental()">Cancelar</button>
      </div>
    </div>
  </div>
</main>
