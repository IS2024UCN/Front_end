<div class="form-container">
  <form [formGroup]="passwordChangeForm" (ngSubmit)="onSubmit()">
    <h2>Cambiar Contraseña</h2>
    
    <!-- Contraseña actual -->
    <div class="form-group">
      <label for="currentPassword">Contraseña actual</label>
      <input
        type="password"
        id="currentPassword"
        formControlName="currentPassword"
        placeholder="Ingrese su contraseña actual"
        required
      />
      <div *ngIf="currentPassword?.invalid && currentPassword?.touched" class="error">
        La contraseña actual es obligatoria.
      </div>
    </div>

    <!-- Nueva contraseña -->
    <div class="form-group">
      <label for="newPassword">Nueva contraseña</label>
      <input
        type="password"
        id="newPassword"
        formControlName="newPassword"
        placeholder="Ingrese la nueva contraseña"
        required
      />
      <div *ngIf="newPassword?.invalid && newPassword?.touched" class="error">
        La nueva contraseña debe tener al menos 6 caracteres.
      </div>
    </div>

    <!-- Confirmar nueva contraseña -->
    <div class="form-group">
      <label for="confirmPassword">Confirmar nueva contraseña</label>
      <input
        type="password"
        id="confirmPassword"
        formControlName="confirmPassword"
        placeholder="Confirme la nueva contraseña"
        required
      />
      <div *ngIf="passwordMismatch" class="error">
        Las contraseñas no coinciden.
      </div>
    </div>

    <!-- Botón enviar -->
    <div class="form-group">
      <button type="submit" [disabled]="passwordChangeForm.invalid">
        Cambiar contraseña
      </button>
    </div>
  </form>

  <!-- Botón "Atrás" -->
  <a (click)="goBack()"
     class="secundarybutton font-semibold rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center text-green-950">
    Atrás
  </a>
</div>
