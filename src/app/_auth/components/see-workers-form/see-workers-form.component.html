<!-- Botón de Volver -->
<div class="mb-4 flex justify-end">
    <button (click)="goBack()" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
        Volver
    </button>
</div>

<div class="container mx-auto p-4">
    <div class="relative overflow-x-auto">
        <!-- Barra de búsqueda -->
        <div class="mb-4">
            <input type="text" placeholder="Buscar por nombre" (input)="onSearch($event)" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2.5" />
        </div>

        <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                <tr>
                    <th scope="col" class="px-6 py-3">Id</th>
                    <th scope="col" class="px-6 py-3">Name</th>
                    <th scope="col" class="px-6 py-3">Rut</th>
                    <th scope="col" class="px-6 py-3">Email</th>
                    <th scope="col" class="px-6 py-3">Phone</th>
                    <th scope="col" class="px-6 py-3">Active</th>
                    <th scope="col" class="px-6 py-3">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let worker of filteredWorkers" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700">
                    <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">{{ worker.id }}</td>
                    <td class="px-6 py-4">
                        <input [(ngModel)]="worker.name" [readonly]="!worker.editing" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg w-full p-2.5" style="width: 200px;"/>
                    </td>
                    <td class="px-6 py-4">
                        <span class="bg-gray-50 text-gray-900 text-sm w-full p-2.5" style="width: 200px; display: inline-block;">
                            {{ worker.rut }}
                        </span>
                    </td>
                    
                    <td class="px-6 py-4">
                        <input [(ngModel)]="worker.email" [readonly]="!worker.editing" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg w-full p-2.5" style="width: 300px;"/>
                    </td>
                    <td class="px-6 py-4">
                        <input [(ngModel)]="worker.phone" [readonly]="!worker.editing" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg w-full p-2.5" style="width: 200px;"/>
                    </td>
                    <td class="px-6 py-4">
                        <select [(ngModel)]="worker.active" [disabled]="!worker.editing" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg w-full p-2.5" style="width: 150px;">
                            <option [value]="1">Activo</option>
                            <option [value]="0">Inactivo</option>
                        </select>
                    </td>
                    <td class="px-6 py-4">
                        <!-- Contenedor de botones de acción -->
                        <div class="flex space-x-3 justify-center">
                            <!-- Botón de Editar -->
                            <button *ngIf="!worker.editing" (click)="enableEditWorker(worker)" class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:ring-opacity-50">
                                Editar
                            </button>

                            <!-- Botones de Guardar, Cancelar y Confirmar solo si está en modo edición -->
                            <button *ngIf="worker.editing" (click)="confirmChanges(worker)" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                                Confirmar Cambio
                            </button>

                            <button *ngIf="worker.editing" (click)="cancelEdit(worker)" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50">
                                Cancelar
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
