<div class="video-background">
  <video autoplay muted loop id="background-video">
    <source src="./assets/cine.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>

<div class="content-container">
  <div class="welcome-text">
    <h1 class="text-8xl font-extrabold tracking-widest" style="color: #f2e3bc; font-family: 'Impact', serif;">
      ¿No tienes Cuenta?,<span class="center-text" style="display: block; line-height: 1;"> Regístrate y accede a un mundo de</span> Entretenimiento
    </h1>
  </div>


  <div class="form-container">
    <form class="form-content" [formGroup]="form">
      <div class="flex-grow flex flex-col justify-center">
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-widest text-center mb-5" style="color: #c19875; font-family: 'Impact', sans-serif;">REGISTRARSE</h1>
        <hr class="w-48 h-1 mx-auto border-0 rounded mb-0.5">
  
        <!-- Nombre -->
        <div class="mb-2">
            <label for="name" class="mb-2 text-sm font-medium text-gray-900" style="color: #c19875; font-family: 'Impact', serif;">Nombres</label>
          <input [class.is-invalid]="nameValidate" name="name" type="text" formControlName="name" id="name"
            placeholder="Ingrese sus nombres"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2.5" />
          <small *ngIf="nameValidate" style="font-size:x-small;" class="text-red-500 font-medium">Ingrese nombres válidos</small>
        </div>
  
        <!-- Apellido -->
        <div class="mb-2">
          <label for="last_name" class="mb-2 text-sm font-medium text-gray-900" style="color: #c19875; font-family: 'Impact', serif;">Apellidos</label>
    
          <input [class.is-invalid]="last_nameValidate" name="last_name" type="text" formControlName="last_name" id="last_name"
            placeholder="Ingrese sus apellidos"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2.5" />
          <small *ngIf="last_nameValidate" style="font-size:x-small;" class="text-red-500 font-medium">Ingrese apellidos
            válidos.</small>
        </div>
    
        <!-- Correo -->
        <div class="mb-2">
          <label for="email" class="mb-2 text-sm font-medium text-gray-900" style="color: #c19875; font-family: 'Impact', serif;">Correo</label>
          <input [class.is-invalid]="emailValidate" type="email" id="email" formControlName="email"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2.5"
            placeholder="Ingrese su correo electrónico" name="email" />
          <small *ngIf="emailValidate" style="font-size:x-small;" class="text-red-500 font-medium">Ingrese un correo
            válido.</small>
        </div>
    
        <!-- rut -->
        <div class="mb-2">
          <label for="rut" class="mb-2 text-sm font-medium text-gray-900" style="color: #c19875; font-family: 'Impact', serif;">Rut</label>
    
          <input [class.is-invalid]="rutValidate" name="rut" type="rut" formControlName="rut"
            id="rut" placeholder="Ingrese su rut"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2.5" />
          <small *ngIf="rutValidate" style="font-size:x-small;" class="text-red-500 font-medium">Ingrese un rut
            válido.</small>
        </div>
  
  
        <!--telefono-->
        <div class="mb-2">
          <label for="phone" class="mb-2 text-sm font-medium text-gray-900" style="color: #c19875; font-family: 'Impact', serif;">Teléfono</label>
    
          <input [class.is-invalid]="phoneValidate" name="phone" type="text" formControlName="phone"
            id="phone" placeholder="Ingrese su teléfono"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2.5" />
            <small *ngIf="phoneValidate" style="font-size:x-small;" class="text-red-500 font-medium">Ingrese un teléfono
              válido.</small>
          </div>
    
        <div class="mb-2"></div>
        <!-- Errores -->
        <div *ngFor="let error of errorMessage" class="bg-red-500 rounded-lg mb-5 flex justify-center">
          <a *ngIf="error" class="text-white text-sm font-medium m-5">
    
            {{ error }}
    
          </a>
        </div>
    
        <!-- Botones -->
        <button type="button" (click)="register()"
            class="primarybutton font-extrabold rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center mb-3 text-white" style="font-family: 'Arial Black', sans-serif;">Registrar
        </button>
    
        <a (click)="goToLogin()"
            class="secundarybutton font-semibold rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center text-white" style="font-family: 'Arial Black', sans-serif;">Iniciar Sesión
        </a>
    
      </div>
    </form>
  </div>
</div>
