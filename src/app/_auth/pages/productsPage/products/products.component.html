<!-- Botón de Volver -->
<div class="mb-4 flex justify-end">
    <button (click)="goBack()" class="back-button">Volver</button>
</div>
<div class="container mx-auto p-4 flex flex-col min-h-screen">
        <div class="relative overflow-x-auto flex-grow">
            <!-- Barra de búsqueda -->
            <div class="mb-4">
                <input type="text" placeholder="Buscar por título" (input)="onSearch($event)" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2.5" />
            </div>
    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
        <tr>
          <th scope="col" class="px-6 py-3">ISBN</th>
          <th scope="col" class="px-6 py-3">Titulo</th>
          <th scope="col" class="px-6 py-3">Creador</th>
          <th scope="col" class="px-6 py-3">Precio</th>
          <th scope="col" class="px-6 py-3">Editorial/Estudio</th>
          <th scope="col" class="px-6 py-3">Fecha de Publicación</th>
          <th scope="col" class="px-6 py-3">Tipo</th>
          <th scope="col" class="px-6 py-3">Stock Disponible</th>
        </tr>
      </thead>
      <tbody>
        <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700" *ngFor="let product of filteredProducts">
          <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
            {{ product.ISBN }}
          </th>
          <td class="px-6 py-4">{{ product.title }}</td>
          <td class="px-6 py-4">{{ product.creator }}</td>
          <td class="px-6 py-4">
            <!-- Precio editable -->
            <!-- Precio editable -->
            <span *ngIf="!product.editingPrice">
                 ${{ product.rental_price }}
                    <button (click)="enableEditPrice(product)" class="text-blue-500 ml-2">Editar</button>
                </span>
                 <span *ngIf="product.editingPrice">
                 <input type="number" [(ngModel)]="product.rental_price" class="border rounded px-2 py-1" />
                <button (click)="savePrice(product)" class="text-green-500 ml-2">Guardar</button>
                 <button (click)="cancelEditPrice(product)" class="text-red-500 ml-2">Cancelar</button>
             </span>
            </td>
          <td class="px-6 py-4">{{ product.publisher }}</td>
          <td class="px-6 py-4">{{ product.release_date.split('T')[0] }}</td>
          <td class="px-6 py-4">{{ product.type }}</td>
          <td class="px-6 py-4">{{ product.available_stock }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
